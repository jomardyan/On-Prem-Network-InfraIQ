[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onprem-network-infraiq"
version = "2.1.0"
description = "Enterprise-grade network discovery and security assessment platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "On-Prem Network InfraIQ Team", email = "info@onprem-infraiq.com"}
]
maintainers = [
    {name = "On-Prem Network InfraIQ Team", email = "info@onprem-infraiq.com"}
]
keywords = ["network", "security", "scanning", "vulnerability", "assessment", "cybersecurity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
    "python-nmap>=0.7.1",
    "scapy>=2.4.5",
    "dnspython>=2.2.0",
    "requests>=2.25.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "cryptography>=3.4.0",
    "paramiko>=2.7.0",
    "impacket>=0.9.24",
    "psutil>=5.8.0",
    "netifaces>=0.11.0",
    "python-whois>=0.7.0",
    "shodan>=1.25.0",
    "censys>=2.1.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "sqlalchemy>=1.4.0",
    "alembic>=1.7.0",
    "fastapi>=0.70.0",
    "uvicorn>=0.15.0",
    "jinja2>=3.0.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "tox>=4.0.0",
    "build>=0.8.0",
    "twine>=4.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "myst-parser>=0.18.0",
]
all = [
    "onprem-network-infraiq[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/jomardyan/On-Prem-Network-InfraIQ"
Documentation = "https://github.com/jomardyan/On-Prem-Network-InfraIQ/blob/main/README.md"
Repository = "https://github.com/jomardyan/On-Prem-Network-InfraIQ"
"Bug Tracker" = "https://github.com/jomardyan/On-Prem-Network-InfraIQ/issues"
Changelog = "https://github.com/jomardyan/On-Prem-Network-InfraIQ/blob/main/CHANGELOG.md"

[project.scripts]
onprem-infraiq = "onprem_network_infraiq.cli:main"
infraiq = "onprem_network_infraiq.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["onprem_network_infraiq*"]

[tool.setuptools.package-data]
onprem_network_infraiq = ["py.typed", "data/*", "templates/*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security-related",
    "network: marks tests as network-related",
]

[tool.coverage.run]
source = ["onprem_network_infraiq"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
