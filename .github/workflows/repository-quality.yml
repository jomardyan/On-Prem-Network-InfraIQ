name: Repository quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the Python distribution and full development dependencies
        run: python -m pip install -e '.[dev]' pip-audit pytest-timeout
      - name: Run Python unit and serialization regressions
        run: python -m pytest tests/unit --timeout=30 -W error::RuntimeWarning
      - name: Audit the installed Python dependency graph
        run: python -m pip_audit --local
      - name: Build Python wheel and source distribution
        run: python -m build --outdir dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/python/*
          if-no-files-found: error
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
      - run: dotnet restore "Dev1.sln"
      - run: dotnet build "Dev1.sln" -c Release --no-restore -p:EnforceCodeStyleInBuild=true
      - run: dotnet test Discovery.Tests/Discovery.Tests.csproj -c Release --no-build
      - run: dotnet list "Dev1.sln" package --vulnerable --include-transitive
      - run: dotnet publish Discovery.Web/Discovery.Web.csproj -c Release --no-build --self-contained false -o dist/web
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v3
