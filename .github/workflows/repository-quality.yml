name: Repository quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the Python distribution and full development dependencies
        run: make python-install-dev PYTHON=python
      - name: Run Python unit and serialization regressions
        run: make python-test PYTHON=python
      - name: Audit the installed Python dependency graph
        run: python -m pip_audit --local
      - name: Build Python wheel and source distribution
        run: make python-build PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/python/*
          if-no-files-found: error
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
      - run: make help restore
      - run: make lint
      - run: make dotnet-test
      - run: dotnet list "Dev1.sln" package --vulnerable --include-transitive
      - run: make package
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v4
